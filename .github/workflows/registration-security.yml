name: Registration security checks
on:
  pull_request:
    paths:
      - 'app/api/auth/register/route.ts'
      - 'components/FastPlayerOnboardForm.tsx'
      - 'lib/signup-turnstile*'
      - '.github/workflows/registration-security.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run lib/signup-turnstile.test.ts
      - run: npx tsc --noEmit
